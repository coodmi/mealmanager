name: Build & Deploy to Play Store

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build AAB & Deploy to Internal Testing
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android build)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      # 4. Get dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 5. Decode keystore from secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      # 6. Create key.properties
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # 7. Decode google-services.json
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # 8. Build release AAB
      - name: Build release AAB
        run: flutter build appbundle --release

      # 9. Deploy to Google Play Internal Testing
      - name: Deploy to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.mealmanager
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # 10. Send email notification
      - name: Send email notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Meal Manager — New build deployed to Internal Testing"
          to: asifmollik93@gmail.com,mealmanagerapps@gmail.com
          from: Meal Manager CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            A new build of Meal Manager has been deployed to Google Play Internal Testing.

            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            💬 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.event.head_commit.author.name }}
            🕐 Time: ${{ github.event.head_commit.timestamp }}

            Open Google Play to download the latest build:
            https://play.google.com/apps/internaltest/

      # 11. Send failure email if build/deploy fails
      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Meal Manager — Build/Deploy FAILED"
          to: asifmollik93@gmail.com,mealmanagerapps@gmail.com
          from: Meal Manager CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ⚠️ The latest build of Meal Manager FAILED.

            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            💬 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.event.head_commit.author.name }}

            Check the Actions log for details:
            https://github.com/${{ github.repository }}/actions
