name: Flutter CI/CD — Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_distribute:
    name: Build APK & Distribute via Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: Test
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build #${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Meal Manager — New build #${{ github.run_number }} ready to test"
          to: asifmollik93@gmail.com,mealmanagerapps@gmail.com
          from: Meal Manager CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            A new build of Meal Manager is ready on Firebase App Distribution.

            📦 Build: #${{ github.run_number }}
            🌿 Branch: ${{ github.ref_name }}
            💬 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.event.head_commit.author.name }}
            🕐 Time: ${{ github.event.head_commit.timestamp }}

            📲 Open Firebase App Distribution to install:
            https://appdistribution.firebase.google.com

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Meal Manager — Build #${{ github.run_number }} FAILED"
          to: asifmollik93@gmail.com,mealmanagerapps@gmail.com
          from: Meal Manager CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ⚠️ Build #${{ github.run_number }} failed.

            🌿 Branch: ${{ github.ref_name }}
            💬 Commit: ${{ github.event.head_commit.message }}

            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
